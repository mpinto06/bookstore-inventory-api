services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
      POSTGRES_USER: ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    ports:
      # Solo loopback. 5433 (no 5432) por defecto para no chocar con un PostgreSQL local y
      # coincidir con el DB_URL por defecto del backend cuando se ejecuta con Maven.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+: la imagen guarda los datos bajo /var/lib/postgresql (no /data)
      - bookstore-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bookstore}
      DB_USER: ${POSTGRES_USER:-bookstore}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    restart: unless-stopped

volumes:
  bookstore-db-data:
