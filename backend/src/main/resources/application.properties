spring.application.name=bookstore-inventory-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bookstore}
spring.datasource.username=${DB_USER:bookstore}
spring.datasource.password=${DB_PASSWORD:bookstore}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false

# Instantes siempre en UTC hacia/desde la BD, sin depender de la zona de la JVM
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON en snake_case (Jackson 3)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Falla rápido (503) si la BD no responde, en lugar de esperar los 30 s por defecto
spring.datasource.hikari.connection-timeout=5000

# Tasas de cambio (API externa, base USD). Todo es sobreescribible por variable de entorno.
exchange-rate.api.url=${EXCHANGE_RATE_API_URL:https://api.exchangerate-api.com/v4/latest/USD}
exchange-rate.api.connect-timeout=${EXCHANGE_RATE_CONNECT_TIMEOUT:3s}
exchange-rate.api.read-timeout=${EXCHANGE_RATE_READ_TIMEOUT:4s}
# enabled=false desactiva el refresco al arrancar y el programado (útil en tests)
exchange-rate.refresh.enabled=${EXCHANGE_RATE_REFRESH_ENABLED:true}
exchange-rate.refresh.on-startup=${EXCHANGE_RATE_REFRESH_ON_STARTUP:true}
# Zona explícita: en Docker el reloj suele estar en UTC
exchange-rate.refresh.cron=${EXCHANGE_RATE_REFRESH_CRON:0 0 3 * * *}
exchange-rate.refresh.zone=${EXCHANGE_RATE_REFRESH_ZONE:America/Caracas}

# Precio de venta: margen sobre el costo en moneda local (porcentaje)
pricing.margin-percentage=${PRICING_MARGIN_PERCENTAGE:40}
# Caché en memoria de las tasas y pausa sin llamar a la API tras un fallo
exchange-rate.cache-ttl=${EXCHANGE_RATE_CACHE_TTL:PT15M}
exchange-rate.failure-backoff=${EXCHANGE_RATE_FAILURE_BACKOFF:PT1M}
