spring.application.name=bookstore-inventory-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bookstore}
spring.datasource.username=${DB_USER:bookstore}
spring.datasource.password=${DB_PASSWORD:bookstore}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false

# JSON en snake_case (Jackson 3)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Falla rápido (503) si la BD no responde, en lugar de esperar los 30 s por defecto
spring.datasource.hikari.connection-timeout=5000
